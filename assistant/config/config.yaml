  high_perf_fps: 30

models:
  planner: "llama3"
  online: "gpt-4o-mini"
  asr: "base.en"
  tts: "vits"

audio:
  sample_rate: 16000
  vad_threshold: 0.01
  silence_duration: 1.5
  chunk_size: 0.3
  whisper_model: "base.en"
  background_wake_enabled: false
  background_wake_interval_seconds: 1.75
