models:
  planner: "llama3"
  claude_agent: "llama3"
  codex_agent: "codellama"
runtime:
  # Set to true to simulate actions instead of executing them
  simulate_actions: false
audio:
  # mic_device: auto-detected (uncomment and set index to override)
  # mic_device: 9
  # speaker_device: auto-detected (uncomment and set index to override)
  # speaker_device: 3
  sample_rate: 16000
  # VAD (Voice Activity Detection) tuning
  vad_threshold: 0.01
  silence_duration: 1.5
  chunk_size: 0.3
