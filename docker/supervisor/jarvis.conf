[program:jarvis-api]
directory=/opt/jarvis
command=/opt/jarvis/.venv/bin/python -m uvicorn jarvis.api.app:create_app --factory --host 0.0.0.0 --port 8000
autostart=true
autorestart=true
startsecs=5
stopasgroup=true
killasgroup=true
stopsignal=TERM
stdout_logfile=/var/log/jarvis/stdout.log
stderr_logfile=/var/log/jarvis/stderr.log
environment=JARVIS_ENV="production",JARVIS_API_ENABLED="true",JARVIS_API_HOST="0.0.0.0",JARVIS_API_PORT="8000"
